gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/billydread1531/gateway
    tag: "p10-latest"
  # El default del chart es LoadBalancer (heredado de P5/P8, antes de la
  # restriccion de costo cero de P10). Un LoadBalancer de Azure cobra por
  # hora mientras exista su IP publica; se accede al gateway solo por
  # port-forward (ver P10/scripts/generar-trafico.ps1 y verificar.ps1).
  service:
    type: ClusterIP
  config:
    LOG_LEVEL: "debug"
    OTEL_SERVICE_NAME: "gateway"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
    # Fallo inducido de la demo del canary gobernado por metricas (ver
    # P10/scripts/prueba-canary-metricas.ps1). Por defecto apagado: cuando se
    # pone en "true" aqui, Argo Rollouts despliega la revision nueva como
    # canary y el AnalysisTemplate "gateway-metrics" la mide y revierte sola.
    CANARY_FAULT_INJECTION: "false"
    CANARY_FAULT_ERROR_RATE: "0.5"
    CANARY_FAULT_LATENCY_MS: "2000"
    # Cambia en cada corrida de prueba (ver prueba-canary-metricas.ps1) solo
    # para forzar un pod-template-hash nuevo: con el mismo hash que una
    # revision ya existente en el historial (replicaCount/imagen/config
    # idénticos entre corridas repetidas), Argo Rollouts reutiliza la
    # revision y su AnalysisRun ya concluido en vez de medir de nuevo.
    CANARY_TEST_NONCE: "1792129974"
  autoscaling:
    minReplicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

# cronjobs y rabbitmq se conservan tal cual (flujo de P8 sin degradar), pero
# no se usan activamente en las pruebas de P10.
cronjobs:
  image:
    repository: ghcr.io/billydread1531/cronjobs
    tag: "p10-latest"

postgresql:
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

rabbitmq:
  resources:
    requests:
      cpu: 30m
      memory: 96Mi
