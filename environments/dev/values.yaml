global:
  environment: dev
  logLevel: debug

# ---------------------------------------------------------------------------
# Practica 10: imagenes en GitHub Container Registry (ghcr.io), no en Azure
# Container Registry. ACR tiene un costo fijo mensual solo por existir;
# ghcr.io es gratuito para paquetes publicos y el workflow
# .github/workflows/p10-observability.yml publica ahi con el GITHUB_TOKEN,
# sin credenciales nuevas que gestionar. Tag real: se actualiza manualmente
# tras cada build (ver P10/scripts/).
# ---------------------------------------------------------------------------

auth-service:
  replicaCount: 2
  image:
    repository: ghcr.io/billydread1531/auth-service
    tag: "p10-latest"
  config:
    LOG_LEVEL: "debug"
    OTEL_SERVICE_NAME: "auth-service"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
    # Fallo inducido de la demo "sintoma a causa" (ver P10/runbooks/ y
    # P10/scripts/prueba-sintoma-causa.ps1). Por defecto apagado.
    FAULT_INJECTION: "false"
    FAULT_ERROR_RATE: "0.4"
    FAULT_EXTRA_LATENCY_MS: "1500"
  autoscaling:
    minReplicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

cursos-service:
  replicaCount: 2
  image:
    repository: ghcr.io/billydread1531/cursos-service
    tag: "p10-latest"
  config:
    LOG_LEVEL: "debug"
    OTEL_SERVICE_NAME: "cursos-service"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
  autoscaling:
