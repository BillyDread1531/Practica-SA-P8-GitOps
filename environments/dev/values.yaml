    tag: "51cfc6bb05adaad0fa541395046daf466f545821"

# Consistencia de los respaldos de Velero: antes de copiar el volumen de datos,
# PostgreSQL fuerza un CHECKPOINT para que los archivos queden en un estado limpio.
postgresql:
  primary:
    # Requests ajustados al uso real (1-10 m) para que UN nodo pueda alojar todas
    # las replicas tras perder el otro (capacidad N+1 con la cuota de 4 vCPU).
    resources:
      requests:
        cpu: 50m
    podAnnotations:
      pre.hook.backup.velero.io/container: postgresql
      pre.hook.backup.velero.io/command: '["/bin/bash", "-c", "PGPASSWORD=$(cat /opt/bitnami/postgresql/secrets/postgres-password) psql -U postgres -c CHECKPOINT"]'
      pre.hook.backup.velero.io/on-error: Continue
      pre.hook.backup.velero.io/timeout: 60s

rabbitmq:
  resources:
    requests:
      cpu: 50m
