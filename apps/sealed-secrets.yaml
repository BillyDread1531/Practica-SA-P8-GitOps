apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Ola 0: controladores base (CRDs) antes que cualquier app que los use.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # El repo de charts se movio de bitnami-labs.github.io a bitnami.github.io
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.18.6
    helm:
      values: |
        # Nombre esperado por kubeseal (--controller-name por defecto)
        fullnameOverride: sealed-secrets-controller
        # Sin rotacion automatica: la copia de la llave en Key Vault
        # (P9/scripts/backup-sealed-key.ps1) no queda obsoleta.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
