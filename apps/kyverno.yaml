apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      values: |
        # Requests ajustados al uso real: permite que un solo nodo aloje todo el sistema
        # cuando el otro se pierde (cuota regional de 4 vCPU = maximo 2 nodos D2s).
        # Solo se usan los ClusterPolicy clasicos (grupo kyverno.io). Los CRD del grupo
        # policies.kyverno.io (CEL) no se usan y ArgoCD los reportaba OutOfSync.
        crds:
          groups:
            policies:
              validatingpolicies: false
              policyexceptions: false
              imagevalidatingpolicies: false
              namespacedimagevalidatingpolicies: false
              mutatingpolicies: false
              namespacedmutatingpolicies: false
              generatingpolicies: false
              deletingpolicies: false
              namespaceddeletingpolicies: false
              namespacedvalidatingpolicies: false
        admissionController:
          replicas: 1
          container:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
        backgroundController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        cleanupController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        reportsController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  # El API server normaliza estos dos campos de los CRD (conversion.strategy=None y
  # preserveUnknownFields=false se descartan) y ArgoCD los veia como diferencia perpetua.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
        - /spec/preserveUnknownFields
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
