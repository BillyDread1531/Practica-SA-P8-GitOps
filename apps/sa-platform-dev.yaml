apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-dev
  namespace: argocd
  annotations:
    # Ola 2: usa CRDs de Rollouts/SealedSecrets y esta bajo las politicas Kyverno
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  sources:
    - repoURL: https://github.com/BillyDread1531/Practica-SA-P8-GitOps.git
      targetRevision: p9
      ref: values

    - repoURL: https://github.com/BillyDread1531/Practicas-SA-B-201901385.git
      targetRevision: main
      path: P8/charts/sa-platform
      helm:
        valueFiles:
          - $values/environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
