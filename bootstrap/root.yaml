apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BillyDread1531/Practica-SA-P8-GitOps.git
    targetRevision: p10
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
