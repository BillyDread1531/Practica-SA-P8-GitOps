apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BillyDread1531/Practica-SA-P8-GitOps.git
    targetRevision: p9
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
